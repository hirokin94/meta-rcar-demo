# =====================================================================
# DomFlatcar guest configuration
#   Xen -> UEFI (EDK2 ArmVirtXen) -> Flatcar GRUB -> Linux
# =====================================================================
seclabel='system_u:system_r:domU_t'
name = "DomFlatcar"

kernel = "/usr/lib/xen/boot/XEN_EFI.fd"

memory = 2048
vcpus = 2

acpi = 1

# Storage: PV block (backend = blkback on DomD)
disk = [ 'backend=DomD, backendtype=phy, vdev=xvda, access=rw, no-colo, target=/dev/disk/by-partlabel/flatcar-disk' ]

# Network: PV network (backend = netback on DomD)
vif = [ 'backend=DomD, bridge=xenbr0, mac=08:00:27:ff:cb:d2' ]

on_reboot   = 'destroy'
on_poweroff = 'destroy'
on_crash    = 'preserve'
