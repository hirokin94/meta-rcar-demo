# =====================================================================
# DomFlatcar guest configuration
#   Xen -> UEFI (EDK2 ArmVirtXen) -> Flatcar GRUB -> Linux
# =====================================================================
seclabel='system_u:system_r:domU_t'
name = "DomFlatcar"

kernel = "/usr/lib/xen/boot/XEN_EFI.fd"

memory = 2048
vcpus = 2

# Storage: PV block (backend = blkback on DomD)
disk = [ 'backend=DomD, backendtype=phy, vdev=xvda, access=rw, no-colo, target=/dev/disk/by-partlabel/flatcar-disk' ]

# Network: virtio-net (backend = QEMU on DomD)
virtio=[
'backend=DomD, type=virtio,device, transport=pci, bdf=0000:00:05.0, grant_usage=0, backend_type=qemu',
]

device_model_args=[
'-device', 'virtio-net-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=5,romfile=,netdev=net0,mac=08:00:27:ff:cb:d2',
'-netdev', 'type=tap,id=net0,ifname=vif-flatcar,br=xenbr0,script=no,downscript=no',
]

on_reboot   = 'destroy'
on_poweroff = 'destroy'
on_crash    = 'preserve'
